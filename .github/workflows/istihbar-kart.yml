name: istihbar kart

# vesaire (Cloudflare) yeni haber kuyruğa girince başlatır. Kartı çizer, vesaire'ye yollar; Telegram'a vesaire gönderir.
on:
  workflow_dispatch:

permissions:
  contents: read

# Aynı anda tek iş; çalışırken gelen tetiklemeler sıraya girer (her iş kuyruğun tamamını boşaltır).
concurrency:
  group: istihbar-kart
  cancel-in-progress: false

jobs:
  kart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: node scripts/kart-gonder.mjs
        env:
          VESAIRE_URL: https://vesaire.tidsrost.com
          KART_ANAHTARI: ${{ secrets.KART_ANAHTARI }}
